<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <rect width="640" height="360" rx="16" fill="#F8FAFC"/>
  <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1" fill="#CBD5E1"/>
  </pattern>
  <rect width="640" height="360" rx="16" fill="url(#dot-grid)" opacity="0.65"/>

  <!-- Outer architectural wireframe frame -->
  <rect x="44" y="40" width="552" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Diagonal placeholder wireframe crosslines -->
  <line x1="44" y1="40" x2="596" y2="320" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="596" y1="40" x2="44" y2="320" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Central geometric syntax lattice -->
  <g transform="translate(320, 180)">
    <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <line x1="0" y1="-78" x2="0" y2="78" stroke="#CBD5E1" stroke-width="1.25"/>
    <line x1="-68" y1="-39" x2="68" y2="39" stroke="#CBD5E1" stroke-width="1.25"/>
    <line x1="68" y1="-39" x2="-68" y2="39" stroke="#CBD5E1" stroke-width="1.25"/>

    <!-- Minimal bracket emblem -->
    <path d="M-15,-10 L-25,0 L-15,10" stroke="#1E40AF" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15,-10 L25,0 L15,10" stroke="#1E40AF" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="4" y1="-13" x2="-4" y2="13" stroke="#2563EB" stroke-width="2.25" stroke-linecap="round"/>
  </g>

  <!-- Corner vertex markers -->
  <circle cx="44" cy="40" r="3" fill="#94A3B8"/>
  <circle cx="596" cy="40" r="3" fill="#94A3B8"/>
  <circle cx="44" cy="320" r="3" fill="#94A3B8"/>
  <circle cx="596" cy="320" r="3" fill="#94A3B8"/>
</svg>
